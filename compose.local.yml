# Local check of the production image: docker compose -f compose.local.yml up --build,
# then open http://localhost:3000. Timeweb App Platform deploys from the Dockerfile instead.
services:
  site:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_ADS_ID: ${NEXT_PUBLIC_ADS_ID:-}
        NEXT_PUBLIC_ADS_LEAD_LABEL: ${NEXT_PUBLIC_ADS_LEAD_LABEL:-}
        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
